syntax = "proto3";

package androidx.media3.demo.session;

option java_package = "net.hevsoft.androidmedia";
option java_multiple_files = true;

message Preferences {
  // The media id of the last played item.
  string media_id = 1;
  // The position in the last played item in milliseconds.
  int64 position_ms = 2;
  // The original artwork URI of the last played item.
  string artwork_original_uri = 3;
  // The artwork image data of the last played item.
  bytes artwork_data = 4;
  // The duration of the last played item in milliseconds, or C.TIME_UNSET if
  // unknown.
  int64 duration_ms = 5;
  // The last playlist loaded from Flutter, restored when the service starts without Flutter.
  repeated PlaylistItem playlist = 6;
  // Android Keystore AES-GCM encrypted `PlaylistHeaders` (12-byte IV + ciphertext). Empty when
  // no playlist item opted in to persisting its headers.
  bytes encrypted_headers = 7;
}

message PlaylistItem {
  string id = 1;
  string uri = 2;
  string art_uri = 3;
  string title = 4;
  string album = 5;
  map<string, string> extra = 6;
}

message PlaylistHeaders {
  // Keyed by PlaylistItem.id.
  map<string, Headers> items = 1;
}

message Headers {
  map<string, string> uri_headers = 1;
  map<string, string> art_headers = 2;
}
